<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anmeldung · ExternPlan</title><link rel="stylesheet" href="/style.css"></head><body class="login-page"><main class="login-shell"><div class="brand">SG <span>ExternPlan</span></div><article class="card"><h1 id="login-title">Anmelden</h1><p id="login-description">Mit E-Mail-Adresse und Passwort anmelden.</p><form id="login-form"><div id="setup-fields" hidden><label for="setup-secret" id="setup-secret-label">Bisheriges Zugangspasswort</label><input id="setup-secret" name="setup_secret" type="password" autocomplete="off"><label for="first-name">Vorname</label><input id="first-name" name="first_name" autocomplete="given-name"><label for="last-name">Name</label><input id="last-name" name="last_name" autocomplete="family-name"></div><div id="email-field"><label for="login-email">E-Mail-Adresse</label><input id="login-email" name="email" type="email" autocomplete="username" required></div><label for="login-password" id="password-label">Passwort</label><input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="256"><div id="new-password-fields" hidden><label for="new-password">Neues Passwort · mindestens 12 Zeichen</label><input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="256"><label for="confirm-password">Neues Passwort wiederholen</label><input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" maxlength="256"></div><p id="login-message" role="alert"></p><button id="login-submit" type="submit">Anmelden</button><button id="login-cancel" type="button" class="secondary" hidden>Abmelden</button></form></article></main><script type="module" src="/login.js"></script></body></html>
