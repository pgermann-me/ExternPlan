<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personenkalender · ExternPlan</title><link rel="stylesheet" href="/style.css"></head>
<body class="person-calendar-window"><main><h1 id="person-name">Personenkalender</h1><h2 id="calendar-period"></h2><div class="toolbar"><button id="previous" class="secondary" aria-label="Vorheriger Monat">←</button><input id="calendar-month" type="month" aria-label="Monat"><button id="next" class="secondary" aria-label="Nächster Monat">→</button><button id="calendar-view" class="secondary" aria-pressed="false">Ansicht ändern</button><button id="reload" class="secondary">Aktualisieren</button><button id="print-calendar" class="secondary" disabled>Drucken / PDF</button><button id="export-ical" class="secondary" disabled>iCal (Monat)</button></div><p id="calendar-message" role="status"></p><div class="person-calendar-board"><div id="person-calendar" role="region" aria-label="Pikettdienste im Monatskalender"></div></div></main><dialog id="duty-details"><div id="duty-content"></div><footer><button id="close-details">Schliessen</button></footer></dialog><script type="module" src="/person-calendar.js"></script></body></html>
